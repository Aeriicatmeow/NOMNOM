name: Update gameVersion
description: Use this template to submit a list of MOD IDs and a gameVersion tag value.\n Their latest release artifacts gameVersion value will be updated to the given value.
title: "[List Submission]: "
labels: ["list-input"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide your values below.

  # NEW: Input field for a single string value
  - type: input
    id: single_string
    attributes:
      label: Single String Value
      description: Enter a single string, such as a name or identifier.
      placeholder: e.g., my-identifier-123
    validations:
      required: true

  # Method 2: Textarea (Free-form custom list of strings)
  - type: textarea
    id: custom_strings
    attributes:
      label: Custom List of Strings
      description: Enter your custom strings here. Please put one value per line.
      placeholder: |
        first_string
        second_string
        third_string
    validations:
      required: true